<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Puidutööstus MES prototüüp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — top bar, role-based left nav, work area, design-notes rail (requirements layer) */
:root{
  --bg:#eef1ed; --surface:#ffffff; --surface-2:#e4e9e3; --fg:#1b231f; --muted:#56635c; --line:#cfd7cf;
  --accent:#2c6449; --accent-fg:#ffffff; --accent-soft:#d6e7dc; --wood:#a8642a; --wood-soft:#f1e2d1;
  --ok:#24734a; --ok-soft:#d8eedf; --warn:#9a5b00; --warn-soft:#f8e7c8; --bad:#a7271f; --bad-soft:#f6dcd9; --info:#2a5890; --info-soft:#dbe6f4;
  --req:#5b3e9a; --req-soft:#e8e1f5;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#18201b; --surface-2:#212a24; --fg:#e3eae5; --muted:#9aa89f; --line:#2e3a32;
  --accent:#6db58f; --accent-fg:#0d1510; --accent-soft:#1f3b2c; --wood:#d99a5e; --wood-soft:#3a2b1d;
  --ok:#6cc892; --ok-soft:#173726; --warn:#e3a640; --warn-soft:#3a2c12; --bad:#f08b81; --bad-soft:#3d1c19; --info:#86b3ea; --info-soft:#1b2c42;
  --req:#b9a2ee; --req-soft:#2c2342; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#18201b; --surface-2:#212a24; --fg:#e3eae5; --muted:#9aa89f; --line:#2e3a32;
  --accent:#6db58f; --accent-fg:#0d1510; --accent-soft:#1f3b2c; --wood:#d99a5e; --wood-soft:#3a2b1d;
  --ok:#6cc892; --ok-soft:#173726; --warn:#e3a640; --warn-soft:#3a2c12; --bad:#f08b81; --bad-soft:#3d1c19; --info:#86b3ea; --info-soft:#1b2c42;
  --req:#b9a2ee; --req-soft:#2c2342; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:1.75rem;line-height:1.1} h2{font-size:1.3rem} h3{font-size:1.05rem}
.mono{font-family:var(--f-mono);font-size:.92em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.2rem;letter-spacing:.02em}
.brand .mark{width:28px;height:28px;border-radius:50%;background:var(--wood);position:relative;flex:none}
.brand .mark::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--surface)}
.brand small{font-family:var(--f-body);font-weight:500;font-size:.75rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.top .grow{flex:1 1 180px;min-width:0}
.search{display:flex;gap:6px;min-width:0}
.search input{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.ctl{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.ctl select{padding:6px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--fg);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;cursor:pointer;font-size:.8rem;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.clock{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);white-space:nowrap}

/* Shell */
.shell{display:grid;grid-template-columns:200px minmax(0,1fr) 300px;gap:0;min-height:calc(100vh - 60px)}
.shell.noreq{grid-template-columns:200px minmax(0,1fr)}
nav.side{border-right:1px solid var(--line);background:var(--surface);padding:14px 10px;display:flex;flex-direction:column;gap:4px}
nav.side .who{font-size:.75rem;color:var(--muted);padding:2px 8px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
nav.side .who b{display:block;color:var(--fg);font-size:.9rem}
nav.side button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:0;background:none;padding:9px 10px;border-radius:var(--r);cursor:pointer;font-weight:500}
nav.side button:hover{background:var(--surface-2)}
nav.side button[aria-current="page"]{background:var(--accent-soft);color:var(--fg);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
nav.side .cnt{font-family:var(--f-mono);font-size:.72rem;background:var(--surface-2);padding:1px 6px;border-radius:10px}
main{min-width:0;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
aside.notes{border-left:1px solid var(--line);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:14px;font-size:.85rem}
aside.notes h3{display:flex;gap:8px;align-items:center}
aside.notes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
aside.notes .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:4px}
@media (max-width:1100px){.shell,.shell.noreq{grid-template-columns:180px minmax(0,1fr)} aside.notes{grid-column:1 / -1;border-left:0;border-top:1px solid var(--line)}}
@media (max-width:720px){.shell,.shell.noreq{grid-template-columns:minmax(0,1fr)} nav.side{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))} nav.side .who{width:100%}}

/* Components */
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}
.head .sub{color:var(--muted);margin-top:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel > .ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.kpis{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;flex:1 1 140px}
.kpi .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .v small{font-family:var(--f-body);font-size:.75rem;font-weight:500;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:var(--r);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.btn.big{padding:14px 20px;font-size:1.05rem;min-height:52px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tbl-wrap{overflow-x:auto;min-width:0}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
td.mono{white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-ootel{background:var(--warn-soft);color:var(--warn)}
.s-planeeritud{background:var(--info-soft);color:var(--info)}
.s-töös{background:var(--accent-soft);color:var(--accent)}
.s-valmis{background:var(--ok-soft);color:var(--ok)}
.s-vahelaos{background:var(--wood-soft);color:var(--wood)}
.s-lõpetatud{background:var(--surface-2);color:var(--muted)}
.s-bad{background:var(--bad-soft);color:var(--bad)}
.bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent)}
.req{display:inline-flex;align-items:center;font-family:var(--f-mono);font-size:.68rem;font-weight:500;padding:1px 6px;border-radius:4px;background:var(--req-soft);color:var(--req);border:1px dashed var(--req);white-space:nowrap}
.reqs{display:inline-flex;flex-wrap:wrap;gap:4px}
.noreq-mode .req,.noreq-mode .reqs{display:none}
.banner{border-radius:var(--r);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.banner.warn{background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn)}
.banner.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.banner.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.banner.info{background:var(--info-soft);border:1px solid var(--info)}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:.78rem;font-weight:600}
.fld input,.fld select,.fld textarea{padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.fld .err{color:var(--bad);font-size:.78rem;font-weight:500}
.fld.has-err input,.fld.has-err select{border-color:var(--bad)}
.stages{display:flex;flex-wrap:wrap;gap:3px;min-width:300px}
.stg{font-size:.7rem;padding:2px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.stg.valmis{background:var(--ok-soft);color:var(--ok)}
.stg.töös{background:var(--accent);color:var(--accent-fg)}
.gantt{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 10px;align-items:center;font-size:.8rem}
.gantt .track{position:relative;height:22px;background:var(--surface-2);border-radius:4px}
.gantt .seg-b{position:absolute;top:3px;bottom:3px;border-radius:3px;background:var(--wood);color:#fff;font-size:.68rem;padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.gantt .seg-b.koost{background:var(--accent);color:var(--accent-fg)}
.gantt .line{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.locked{background:var(--surface-2)}
.card .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .op{font-family:var(--f-display);font-size:1.35rem;font-weight:700}
.lock{font-size:.82rem;color:var(--warn);font-weight:500}
.log{display:flex;flex-direction:column;font-size:.82rem}
.log div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.log time{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:600;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
pre.payload{background:var(--surface-2);border-radius:var(--r);padding:12px;font-family:var(--f-mono);font-size:.75rem;overflow-x:auto;margin:0;max-height:320px}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,12,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:var(--r);max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:var(--r);font-size:.85rem;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.toast.bad{background:var(--bad);color:#fff}
.drawing{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.drawing svg{display:block;width:100%;min-width:480px;height:auto}
.drawing svg text{fill:var(--fg);font-family:var(--f-mono)}
.drawing svg .ln{stroke:var(--fg);fill:none}
.drawing svg .dim{stroke:var(--muted);fill:none;stroke-width:.8}
.drawing svg .stamp{fill:none;stroke:var(--ok);stroke-width:2}
.drawing svg .stamptx{fill:var(--ok)}
.dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:.88rem}
.dl dt{color:var(--muted)} .dl dd{margin:0;font-weight:500}
.empty{padding:20px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .2s ease-out}@keyframes tin{from{transform:translateY(6px);opacity:.4}}}
</style>
</head>

<div id="app"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>

      {k:'KABIIN',n:'Kabiin',en:'Cab',per:1,dw:{nr:'JN-2010',v:4,from:'01.09.2026',old:'v3 (aegunud 01.09.2026)'},shape:'body',st:[S_('jark',.3,.2),S_('pikk',.3,.3),S_('cnc',.5,1.0),S_('lihv',.3,.5),S_('oli',.2,.3)]},

function addWH(d,h){let t=new Date(d);let m=Math.round(h*60);
  const norm=()=>{for(let g=0;g<400;g++){const dy=t.getDay(),hr=t.getHours()+t.getMinutes()/60;

function buildOrder(nr,kt,pk,q,due){const p=PRODUCTS[pk];
  const batches=p.comps.map(c=>({id:`${nr}-${c.k}`,comp:c.k,name:c.n,en:c.en,qty:q*c.per,dw:c.dw,shape:c.shape,loc:null,
    stages:c.st.map(s=>({op:s.op,h:stH(s,q*c.per),status:'ootel',start:null,end:null,by:null,scrap:0,downMin:0,downWhy:''}))}));
  batches.push({id:`${nr}-KOOST`,comp:'KOOST',name:'Koostamine ja pakkimine',en:'Assembly & packing',qty:q,koost:true,loc:null,
    stages:p.koost.map(s=>({op:s.op,h:stH(s,q),status:'ootel',start:null,end:null,by:null,scrap:0,downMin:0,downWhy:''}))});
  return{nr,kt,pk,q,due,status:'planeeritud',hold:'',issued:false,planStart:null,planEnd:null,batches,exported:null,created:new Date(S.now)}}
function compHours(o){return o.batches.filter(b=>!b.koost).map(b=>b.stages.reduce((a,s)=>a+s.h,0))}
function koostHours(o){return o.batches.find(b=>b.koost).stages.reduce((a,s)=>a+s.h,0)}
function schedule(o,start){const ch=compHours(o),mx=Math.max(...ch);o.planStart=start;
  o.batches.filter(b=>!b.koost).forEach((b,i)=>{b.planStart=addWH(start,mx-ch[i]);b.planEnd=addWH(start,mx)});
  const kb=o.batches.find(b=>b.koost);kb.planStart=addWH(start,mx);kb.planEnd=addWH(start,mx+koostHours(o));o.planEnd=kb.planEnd}
function remaining(b){return b.stages.reduce((a,s)=>a+(s.status==='valmis'?0:s.status==='töös'?s.h*.5:s.h),0)}
function delayH(o){return o.batches.reduce((a,b)=>a+b.stages.reduce((x,s)=>x+s.downMin/60+(s.scrap?s.scrap*0.01+0.3:0),0),0)}
function forecast(o){if(o.status==='lõpetatud'||o.status==='valmis'){const kb=o.batches.find(b=>b.koost);return kb.stages[kb.stages.length-1].end||o.planEnd}
  if(o.status==='ootel')return null;
  const comps=o.batches.filter(b=>!b.koost).map(remaining);const base=new Date(Math.max(S.now,o.planStart||S.now));
  return addWH(base,Math.max(0,...comps)+remaining(o.batches.find(b=>b.koost))+delayH(o))}
function lateDays(o){const f=forecast(o);if(!f)return 0;const due=new Date(o.due);due.setHours(16,0,0,0);return f>due?Math.ceil((f-due)/86400000):0}
function progress(o){let t=0,d=0;o.batches.forEach(b=>b.stages.forEach(s=>{t+=s.h;if(s.status==='valmis')d+=s.h;else if(s.status==='töös')d+=s.h*.4}));return t?Math.round(d/t*100):0}
function batchState(b){if(b.stages.every(s=>s.status==='valmis'))return b.loc&&b.loc.startsWith('VL')?'vahelaos':'valmis';return b.stages.some(s=>s.status!=='ootel')?'töös':'ootel'}
function compsReady(o){return o.batches.filter(b=>!b.koost).every(b=>b.stages.every(s=>s.status==='valmis'))}
function backlogH(except){return S.orders.filter(o=>o!==except&&(o.status==='planeeritud'||o.status==='töös')).reduce((a,o)=>a+Math.max(0,...o.batches.filter(b=>!b.koost).map(remaining))*.35,0)}
function bookedFree(k){const m=mat(k);const res=S.bookings.filter(b=>b.mat===k&&!b.issued).reduce((a,b)=>a+b.qty,0);return{stock:m.ladu,res,free:m.ladu-res}}
function needFor(pk,q){return PRODUCTS[pk].bom.map(([k,per])=>({k,need:per*q}))}
function currentStage(b){return b.stages.find(s=>s.status==='töös')||b.stages.find(s=>s.status==='ootel')}
function stageLock(o,b,i){
  if(o.status==='ootel')return L('Tellimus on ootel: ','Order on hold: ')+o.hold;
  if(!o.issued)return L('Ootab materjali väljastust laost (K08)','Waiting for material issue (K08)');
  if(b.koost&&!compsReady(o)){const miss=o.batches.filter(x=>!x.koost&&!x.stages.every(s=>s.status==='valmis')).map(x=>L(x.name,x.en));return L('Koostamist ei saa alustada, pooleli: ','Cannot assemble, still in progress: ')+miss.join(', ')}
  if(i>0&&b.stages[i-1].status!=='valmis')return L('Eelmine etapp pooleli: ','Previous step not done: ')+opName(b.stages[i-1].op);
  return null}
function refreshOrderStatus(o){if(o.status==='ootel'||o.status==='lõpetatud')return;
  const kb=o.batches.find(b=>b.koost);if(kb.stages.every(s=>s.status==='valmis')){o.status='valmis';return}
  o.status=o.batches.some(b=>b.stages.some(s=>s.status!=='ootel'))?'töös':'planeeritud'}

  case 'wh':return vWh();case 'log':return vLog();case 'search':return vSearch();default:return ''}}

/* ---- Tellimuste nimekiri (K02, F-01) ---- */
function vOrders(){
  const flt=['kõik','ootel','planeeritud','töös','valmis','lõpetatud'];
  const list=S.orders.filter(o=>S.filter==='kõik'||o.status===S.filter).sort((a,b)=>b.nr.localeCompare(a.nr));
  return `<div class="head"><div><h1>${S.role==='myyk'?L('Tellimuste seis','Order status'):L('Tootmistellimused','Production orders')} ${req('K02','F-01','U-02')}</h1>
    <div class="sub">${L('Kõik tellimused ühes kohas: staatus, edenemine ja eeldatav valmimine.','All orders in one place: status, progress and expected completion.')}</div></div>
    ${S.role==='planeerija'?`<button class="btn pri" data-act="nav" data-v="new">+ ${L('Uus tootmistellimus','New production order')}</button>`:''}</div>
  <div class="row" role="group" aria-label="${L('Filter','Filter')}">${flt.map(f=>`<button class="btn" data-act="filter" data-v="${f}" aria-pressed="${S.filter===f}" style="${S.filter===f?'background:var(--accent-soft);border-color:var(--accent)':''}">${f==='kõik'?L('Kõik','All'):statusName(f)} <span class="muted num">${f==='kõik'?S.orders.length:S.orders.filter(o=>o.status===f).length}</span></button>`).join('')}</div>
  <div class="panel"><div class="tbl-wrap"><table>
    <thead><tr><th>${L('Tellimus','Order')}</th><th>${L('Klienditellimus','Customer PO')}</th><th>${L('Toode','Product')}</th><th class="r">${L('Kogus','Qty')}</th><th>${L('Staatus','Status')}</th><th>${L('Edenemine','Progress')} ${req('F-13')}</th><th>${L('Tähtaeg','Due')}</th><th>${L('Prognoos','Forecast')} ${req('F-13')}</th></tr></thead>
    <tbody>${list.map(o=>{const f=forecast(o),late=lateDays(o),p=progress(o);return `<tr class="click" data-act="open" data-v="${o.nr}" tabindex="0">
      <td class="mono"><b>${o.nr}</b></td><td class="mono">${o.kt}</td><td>${L(PRODUCTS[o.pk].n,PRODUCTS[o.pk].en)}</td><td class="r num">${o.q}</td>
      <td>${pill(o.status)}</td><td><div class="row" style="flex-wrap:nowrap"><div class="bar" style="flex:1"><i style="width:${p}%"></i></div><span class="num muted">${p}%</span></div></td>
      <td class="num">${fd(o.due)}</td><td class="num">${f?fd(f):'<span class="muted">–</span>'} ${late&&o.status!=='lõpetatud'?`<span class="pill s-bad">+${late} ${L('p','d')}</span>`:''}</td></tr>`}).join('')||`<tr><td colspan="8" class="empty">${L('Selle staatusega tellimusi ei ole','No orders with this status')}</td></tr>`}</tbody></table></div></div>`}

/* ---- Uus tootmistellimus (K01) ---- */
function vNew(){
  if(S.role!=='planeerija')return noAccess();
  const d=S.draft||{kt:'',pk:'',q:'',due:'',checked:false};const e=S.errors;
  const fld=(id,label,inp,r)=>`<div class="fld ${e[id]?'has-err':''}"><label for="${id}">${label} ${r||''}</label>${inp}${e[id]?`<span class="err" id="${id}-err">${esc(e[id])}</span>`:''}</div>`;
  let out=`<div class="head"><div><h1>${L('Uus tootmistellimus','New production order')} ${req('K01','F-01')}</h1>
    <div class="sub">${L('Klienditellimuse põhjal. Süsteem seob komponendid ja materjalid, kontrollib saadavust ja aega ning broneerib materjali.','From a confirmed customer order. The system links components and materials, checks availability and time, and reserves material.')}</div></div>
    <button class="btn" data-act="nav" data-v="orders">${L('Tagasi','Back')}</button></div>
  <div class="panel"><div class="ph"><h2>1. ${L('Tellimuse andmed','Order details')}</h2>${req('R-04','R-02')}</div>
  <form class="f" data-act="checkNew" novalidate>
    ${fld('kt',L('Klienditellimuse nr *','Customer PO no. *'),`<input id="kt" name="kt" value="${esc(d.kt)}" placeholder="KT-59001" autocomplete="off">`)}
    ${fld('pk',L('Toode *','Product *'),`<select id="pk" name="pk"><option value="">${L('Vali toode','Choose product')}</option>${Object.entries(PRODUCTS).map(([k,p])=>`<option value="${k}" ${d.pk===k?'selected':''}>${L(p.n,p.en)}</option>`).join('')}</select>`)}
    ${fld('q2',L('Kogus, tk *','Quantity, pcs *'),`<input id="q2" name="q" inputmode="numeric" value="${esc(d.q)}" placeholder="150">`)}
    ${fld('due',L('Soovitud tähtaeg *','Requested due date *'),`<input id="due" name="due" type="date" value="${esc(d.dueStr||'')}">`)}
    <div class="fld" style="justify-content:flex-end"><button class="btn pri" type="submit">${L('Kontrolli materjali ja aega','Check material and time')}</button></div>
  </form>
  <div class="row muted" style="font-size:.8rem">${L('Proovi: jäta väli tühjaks, sisesta KT-58907 (juba olemas) või telli 60 kõnnituuka (pakend ei jätku).','Try: leave a field empty, enter KT-58907 (already exists) or order 60 push walkers (not enough packaging).')}</div></div>`;
  if(d.checked){const p=PRODUCTS[d.pk];const needs=needFor(d.pk,d.q).map(n=>({...n,...bookedFree(n.k)}));const short=needs.filter(n=>n.need>n.free+1e-9);
    const tmp=buildOrder('UUS','',d.pk,d.q,d.due);const start=addWH(S.now,backlogH(null)+2);schedule(tmp,start);
    const dueEnd=new Date(d.due);dueEnd.setHours(16,0,0,0);const late=tmp.planEnd>dueEnd;
    out+=`<div class="grid2">
    <div class="panel"><div class="ph"><h2>2. ${L('Komponendid','Components')}</h2>${req('F-02')}</div>
      <div class="tbl-wrap"><table><thead><tr><th>${L('Komponent','Component')}</th><th class="r">${L('Kogus','Qty')}</th><th>${L('Kehtiv joonis','Current drawing')}</th><th class="r">${L('Töötunnid','Hours')}</th></tr></thead><tbody>
      ${tmp.batches.map(b=>`<tr><td>${L(b.name,b.en)}</td><td class="r num">${b.qty}</td><td class="mono">${b.dw?`${b.dw.nr} v${b.dw.v}`:'–'}</td><td class="r num">${b.stages.reduce((a,s)=>a+s.h,0).toFixed(1)}</td></tr>`).join('')}
      </tbody></table></div></div>
    <div class="panel"><div class="ph"><h2>3. ${L('Materjali saadavus','Material availability')}</h2>${req('F-04','AS-03')}</div>
      <div class="tbl-wrap"><table><thead><tr><th>${L('Materjal','Material')}</th><th class="r">${L('Vaja','Need')}</th><th class="r">${L('Laos','Stock')}</th><th class="r">${L('Broneeritud','Reserved')}</th><th class="r">${L('Vaba','Free')}</th><th></th></tr></thead><tbody>
      ${needs.map(n=>{const m=mat(n.k),ok=n.need<=n.free+1e-9;return `<tr><td>${esc(m.n)} <span class="muted">(${m.liik})</span></td><td class="r num">${fq(n.need,m.u)} ${m.u}</td><td class="r num">${fq(n.stock,m.u)}</td><td class="r num">${fq(n.res,m.u)}</td><td class="r num">${fq(n.free,m.u)}</td><td>${ok?pill('valmis','OK'):`<span class="pill s-bad">${L('puudu','short')} ${fq(n.need-n.free,m.u)}</span>`}</td></tr>`}).join('')}
      </tbody></table></div></div></div>
    <div class="panel"><div class="ph"><h2>4. ${L('Ajaplaan ja vaba aeg','Schedule and capacity')}</h2>${req('F-03','AS-08','AS-09')}</div>
      <p class="muted" style="margin:0">${L('Komponentide algus nihutatakse nii, et kõik valmiksid samal ajal ja koostamine ei ootaks üksikut detaili.','Component starts are shifted so all finish together and assembly does not wait for one part.')}</p>
      ${gantt(tmp,dueEnd)}
      <dl class="dl"><dt>${L('Varaseim algus (järjekorda arvestades)','Earliest start (given queue)')}</dt><dd class="num">${fdt(tmp.planStart)}</dd>
      <dt>${L('Planeeritud valmimine','Planned completion')}</dt><dd class="num">${fdt(tmp.planEnd)} ${late?`<span class="pill s-bad">${L('ei mahu tähtaega','misses due date')}</span>`:pill('valmis',L('mahub tähtaega','fits due date'))}</dd></dl>
    </div>
    <div class="panel"><div class="ph"><h2>5. ${L('Otsus','Decision')}</h2>${req('F-05','F-13')}</div>
      ${short.length?`<div class="banner warn"><div><b>${L('Materjali ei jätku.','Not enough material.')}</b> ${short.map(n=>esc(mat(n.k).n)).join(', ')}. ${L('Tellimust ei saa kinnitada; see salvestatakse ootel olekus ja ostuvajadus märgitakse.','The order cannot be confirmed; it is saved as on hold and a purchase need is flagged.')}</div>
        <button class="btn warn" data-act="saveHold">${L('Salvesta ootel tellimusena','Save as on hold')}</button></div>`:
      `${late?`<div class="banner warn"><div>${L('Soovitud tähtaeg ei mahu. Kliendile antakse kinnitus prognoositud kuupäevaga','The due date does not fit. The customer is confirmed with forecast date')} <b class="num">${fd(tmp.planEnd)}</b>.</div></div>`:''}
      <div class="row"><button class="btn pri big" data-act="confirmNew">${L('Kinnita ja broneeri materjal','Confirm and reserve material')}</button>
      <span class="muted">${L('Broneering ja ajaplaan salvestatakse ühe toiminguna.','Reservation and schedule are saved in one transaction.')}</span></div>`}
    </div>`}
  return out}
function gantt(o,dueEnd){const all=o.batches;const t0=+o.planStart,t1=Math.max(+o.planEnd,dueEnd?+dueEnd:0);const W=(t1-t0)*1.05||1;
  const pos=d=>Math.max(0,Math.min(100,(d-t0)/W*100));
  return `<div class="tbl-wrap"><div class="gantt" style="min-width:420px">${all.map(b=>`<div>${L(b.name,b.en)}</div><div class="track">
    <div class="seg-b ${b.koost?'koost':''}" style="left:${pos(b.planStart)}%;width:${Math.max(2,pos(b.planEnd)-pos(b.planStart))}%">${fd(b.planEnd)}</div>
    ${dueEnd?`<div class="line" style="left:${pos(dueEnd)}%" title="${L('Tähtaeg','Due')}"></div>`:''}</div>`).join('')}
    <div></div><div class="muted" style="font-size:.72rem;display:flex;justify-content:space-between"><span>${fd(o.planStart)}</span>${dueEnd?`<span style="color:var(--bad)">${L('punane katkendjoon = tähtaeg','red dashed line = due')} ${fd(dueEnd)}</span>`:''}<span>${fd(new Date(t1))}</span></div></div></div>`}

/* ---- Tellimuse detailvaade (K02, K03) ---- */
function vDetail(){const o=S.orders.find(x=>x.nr===S.sel);if(!o)return '';
  const p=PRODUCTS[o.pk],f=forecast(o),late=lateDays(o),comps=o.batches.filter(b=>!b.koost),ready=comps.filter(b=>b.stages.every(s=>s.status==='valmis')).length;
  const bk=S.bookings.filter(b=>b.order===o.nr);const ev=S.log.filter(l=>l.order===o.nr);const can=S.role==='planeerija';
  const downs=[];o.batches.forEach(b=>b.stages.forEach(s=>{if(s.downMin||s.scrap)downs.push({b,s})}));
  return `<div class="head"><div><h1><span class="mono">${o.nr}</span> · ${L(p.n,p.en)} ${req('K02','U-02')}</h1>
    <div class="sub">${L('Klienditellimus','Customer PO')} <span class="mono">${o.kt}</span> · ${o.q} ${L('tk','pcs')} · ${pill(o.status)}</div></div>
    <button class="btn" data-act="nav" data-v="orders">${L('Kõik tellimused','All orders')}</button></div>
  ${o.status==='ootel'?`<div class="banner warn"><div><b>${L('Tellimus on ootel.','Order is on hold.')}</b> ${esc(o.hold)}</div>${can?`<button class="btn" data-act="recheck" data-v="${o.nr}">${L('Kontrolli materjali uuesti','Re-check material')}</button>`:''}</div>`:''}
  ${late&&o.status!=='lõpetatud'&&o.status!=='ootel'?`<div class="banner bad"><div><b>${L('Prognoos ületab tähtaega','Forecast exceeds due date')} ${late} ${L('päeva võrra','day(s)')}.</b> ${L('Põhjus: registreeritud seisakud ja praak.','Cause: registered downtime and scrap.')} ${req('F-12','F-13')}</div></div>`:''}
  <div class="kpis">
    <div class="kpi"><div class="k">${L('Edenemine','Progress')}</div><div class="v">${progress(o)}%</div><div class="bar"><i style="width:${progress(o)}%"></i></div></div>
    <div class="kpi"><div class="k">${L('Komponendid koostamiseks','Components ready')} ${req('F-11')}</div><div class="v">${ready}/${comps.length} <small>${L('valmis','ready')}</small></div></div>
    <div class="kpi"><div class="k">${L('Planeeritud valmimine','Planned')}</div><div class="v num">${fd(o.planEnd)}</div></div>
    <div class="kpi"><div class="k">${L('Prognoos','Forecast')} ${req('F-13')}</div><div class="v num" style="color:${late?'var(--bad)':'inherit'}">${f?fd(f):'–'}</div></div>
    <div class="kpi"><div class="k">${L('Tähtaeg','Due')}</div><div class="v num">${fd(o.due)}</div></div>
  </div>
  <div class="panel"><div class="ph"><h2>${L('Komponendid, seisund ja asukoht','Components, state and location')}</h2>${req('F-02','F-07','F-11')}</div>
    <div class="tbl-wrap"><table><thead><tr><th>${L('Partii','Batch')}</th><th>${L('Komponent','Component')}</th><th class="r">${L('Kogus','Qty')}</th><th>${L('Seisund','State')}</th><th>${L('Asukoht','Location')}</th><th>${L('Tööetapid','Steps')}</th><th>${L('Joonis','Drawing')} ${req('F-10')}</th></tr></thead><tbody>
    ${o.batches.map(b=>{const st=batchState(b),cs=currentStage(b);return `<tr><td class="mono">${b.id}</td><td><b>${L(b.name,b.en)}</b></td><td class="r num">${b.qty}</td><td>${pill(st)}</td>
      <td class="mono">${b.loc?esc(b.loc):cs&&cs.status==='töös'?`<span class="muted">${OPS[cs.op].st}</span>`:'<span class="muted">–</span>'}</td>
      <td><div class="stages">${b.stages.map(s=>`<span class="stg ${s.status}" title="${opName(s.op)}: ${statusName(s.status)}${s.by?' · '+s.by:''}">${opName(s.op)}${s.downMin?' ⚠':''}</span>`).join('')}</div></td>
      <td>${b.dw?`<button class="btn" data-act="drawing" data-v="${b.id}">${b.dw.nr} v${b.dw.v}</button>`:'–'}</td></tr>`}).join('')}
    </tbody></table></div></div>
  <div class="grid2">
    <div class="panel"><div class="ph"><h2>${L('Ajaplaan','Schedule')}</h2>${req('F-03')}</div>${o.planStart?gantt(o,(()=>{const d=new Date(o.due);d.setHours(16);return d})()):`<div class="empty">${L('Ootel tellimusel ajaplaani ei ole','No schedule while on hold')}</div>`}</div>
    <div class="panel"><div class="ph"><h2>${L('Materjal','Material')}</h2>${req('F-05','F-09')}</div>
      ${bk.length?`<div class="tbl-wrap"><table><thead><tr><th>${L('Materjal','Material')}</th><th class="r">${L('Broneeritud','Reserved')}</th><th>${L('Väljastatud','Issued')}</th><th class="r">${L('Praak','Scrap')}</th></tr></thead><tbody>
      ${bk.map(b=>{const m=mat(b.mat);return `<tr><td>${esc(m.n)}${b.extra?` <span class="pill s-ootel">${L('praagi asendus','scrap replacement')}</span>`:''}</td><td class="r num">${fq(b.qty,m.u)} ${m.u}</td><td>${b.issued?pill('valmis',L('jah','yes')):pill('ootel',L('ei','no'))}</td><td class="r num">${b.scrap?fq(b.scrap,m.u):'–'}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty">${L('Materjal on broneerimata','No material reserved')}</div>`}
      ${downs.length?`<div><div class="lbl" style="font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600">${L('Praak ja seisakud','Scrap and downtime')} ${req('F-09','F-12')}</div>
      ${downs.map(({b,s})=>`<div style="font-size:.85rem">${L(b.name,b.en)} · ${opName(s.op)}: ${s.scrap?`${s.scrap} ${L('tk praaki','pcs scrap')}`:''}${s.scrap&&s.downMin?', ':''}${s.downMin?`${s.downMin} min ${L('seisakut','downtime')} (${esc(s.downWhy)})`:''}</div>`).join('')}</div>`:''}
    </div></div>
  ${S.role==='myyk'?`<div class="panel"><div class="ph"><h2>${L('Vastus kliendile','Reply to customer')}</h2>${req('F-13','K02')}</div>
    <textarea id="reply" rows="3" class="fld" style="padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);width:100%">${esc(replyText(o))}</textarea>
    <div class="row"><button class="btn" data-act="copyReply">${L('Kopeeri tekst','Copy text')}</button><span class="muted">${L('E-kiri saadetakse tavapärases e-postis (väljaspool MES-i).','The email is sent from the normal mail client (outside the MES).')}</span></div></div>`:''}
  ${can?vClose(o):''}
  <div class="panel"><div class="ph"><h2>${L('Tegevuste ajalugu','Activity history')}</h2>${req('R-01')}</div>
    <div class="log">${ev.map(l=>`<div><time>${fdt(l.t)}</time><span><b>${esc(l.user)}</b> · ${esc(l.msg)}</span></div>`).join('')||`<div class="empty">–</div>`}</div></div>`}
function replyText(o){const f=forecast(o);const p=PRODUCTS[o.pk];
  if(o.status==='ootel')return L(`Tere! Teie tellimus ${o.kt} (${p.n}, ${o.q} tk) ootab materjali saabumist. Anname uue tarneaja kohe, kui materjal on laos.`,`Hello! Your order ${o.kt} (${p.en}, ${o.q} pcs) is waiting for material. We will confirm a new date once it arrives.`);
  return L(`Tere! Teie tellimus ${o.kt} (${p.n}, ${o.q} tk) on tootmises, valmidus ${progress(o)}%. Eeldatav valmimine on ${fd(f)}.`,`Hello! Your order ${o.kt} (${p.en}, ${o.q} pcs) is in production, ${progress(o)}% complete. Expected completion is ${fd(f)}.`)}
function exportPayload(o){const bk=S.bookings.filter(b=>b.order===o.nr);let work=0,down=0;o.batches.forEach(b=>b.stages.forEach(s=>{work+=s.h;down+=s.downMin}));
  return {liides:'MES → majandustarkvara',tyyp:'TOOTMISTELLIMUS_LOPETATUD',sundmuse_id:`${o.nr}-CLOSE-1`,tootmistellimus:o.nr,klienditellimus:o.kt,toode:o.pk,valmis_kogus:o.q,lopetatud:fdt(S.now),
    materjalikulu:bk.map(b=>({materjal:b.mat,kasutatud:+(b.qty).toFixed(4),sh_praak:+(b.scrap||0).toFixed(4),yhik:mat(b.mat).u})),
    tooaeg_h:+work.toFixed(1),seisakud_min:down,valmistoodete_ladu:o.batches.find(b=>b.koost).loc||'VTL-01'}}
function vClose(o){
  if(o.status==='lõpetatud')return `<div class="panel"><div class="ph"><h2>${L('Tellimus lõpetatud','Order closed')}</h2>${req('K03','+-01')}</div>
    ${o.exported?.ok?`<div class="banner ok"><div>${L('Tegelik kulu ja praak edastatud majandustarkvarale','Actual consumption and scrap sent to accounting software')} ${fdt(o.exported.at)}. ${L('Arve ja saateleht koostatakse majandustarkvaras.','Invoice and delivery note are created there.')}</div></div>`:
    `<div class="banner bad"><div><b>${L('Edastus ebaõnnestus','Transfer failed')}:</b> ${esc(o.exported?.err||'')} ${L('Kirje on järjekorras, andmed ei kao.','The record is queued; no data is lost.')}</div><button class="btn" data-act="retryExport" data-v="${o.nr}">${L('Proovi uuesti','Retry')}</button></div>`}
    <details><summary>${L('Saadetud andmepakett (simuleeritud)','Sent payload (simulated)')}</summary><pre class="payload">${esc(JSON.stringify(exportPayload(o),null,2))}</pre></details></div>`;
  const ok=o.status==='valmis';
  return `<div class="panel"><div class="ph"><h2>${L('Lõpeta tootmistellimus','Close production order')}</h2>${req('K03','F-09','+-01')}</div>
    <p style="margin:0" class="muted">${ok?L('Kõik etapid on tehtud. Lõpetamisel saadetakse tegelik materjalikulu ja praak majandustarkvarasse.','All steps done. Closing sends actual material use and scrap to the accounting software.'):L('Lõpetada saab alles siis, kui pakkimine on registreeritud.','Can be closed only after packing is registered.')}</p>
    <label class="row" style="font-size:.85rem"><input type="checkbox" id="failsim" data-act="failsim" ${S.exportFail?'checked':''}> ${L('Simuleeri liidese viga (majandustarkvara ei vasta)','Simulate interface error (accounting software not responding)')}</label>
    <div class="row"><button class="btn pri" data-act="closeOrder" data-v="${o.nr}" ${ok?'':'disabled'}>${L('Lõpeta tellimus','Close order')}</button></div></div>`}

/* ---- Tootmistöötaja tööjaam (K04–K07) ---- */
function vWorker(){
  if(S.role!=='tootmine')return noAccess();
  const items=[];S.orders.forEach(o=>{if(o.status==='lõpetatud')return;o.batches.forEach(b=>b.stages.forEach((s,i)=>{if(OPS[s.op].st===S.station&&s.status!=='valmis')items.push({o,b,s,i,lock:stageLock(o,b,i)})}))});
  items.sort((a,b)=>(a.s.status==='töös'?-1:0)-(b.s.status==='töös'?-1:0)||(!!a.lock)-(!!b.lock));
  const done=[];S.orders.forEach(o=>o.batches.forEach(b=>b.stages.forEach(s=>{if(OPS[s.op].st===S.station&&s.status==='valmis'&&s.end&&fd(s.end)===fd(S.now))done.push({o,b,s})})));
  const pend=pendingLocations();

  start(v,el){const o=S.orders.find(x=>x.nr===el.dataset.o),b=o.batches.find(x=>x.id===el.dataset.b),s=b.stages[+el.dataset.i];
    if(s.status!=='ootel'){toast(L(`Korduv registreering: etapp on juba alustatud ${fdt(s.start)} (${s.by}). Uut kirjet ei loodud.`,`Duplicate: already started ${fdt(s.start)} (${s.by}). No new record.`),true);return}
    const lock=stageLock(o,b,+el.dataset.i);if(lock){toast(lock,true);return}
    tick(4);s.status='töös';s.start=new Date(S.now);s.by=USERS.tootmine;refreshOrderStatus(o);logEv(o.nr,`${opName(s.op)} alustatud (${b.id}, ${OPS[s.op].st})`);render();toast(L('Alustatud ','Started ')+ft(S.now))},
  finish(v,el){const o=S.orders.find(x=>x.nr===el.dataset.o),b=o.batches.find(x=>x.id===el.dataset.b),s=b.stages[+el.dataset.i];
    if(s.status==='valmis'){toast(L(`Korduv registreering: etapp on juba lõpetatud ${fdt(s.end)}. Uut kirjet ei loodud.`,`Duplicate: already finished ${fdt(s.end)}. No new record.`),true);return}
    el.disabled=true;tick(12);s.status='valmis';s.end=new Date(S.now);logEv(o.nr,`${opName(s.op)} lõpetatud (${b.id})`);
    const allDone=b.stages.every(x=>x.status==='valmis');refreshOrderStatus(o);render();
    if(allDone&&!b.koost){toast(L(`${b.name} valmis. Vii komponent vahelattu ja registreeri asukoht.`,`${b.en} done. Move it to buffer and register location.`));locModal(b.id)}
    else if(allDone&&b.koost){toast(L('Pakkimine tehtud, tellimus valmis. Registreeri valmistoodete lao koht.','Packed, order done. Register finished-goods location.'));locModal(b.id)}
    else toast(L('Lõpetatud ','Finished ')+ft(S.now))},
  issue(v){const o=S.orders.find(x=>x.nr===v);S.bookings.filter(b=>b.order===v&&!b.issued).forEach(b=>{b.issued=true;mat(b.mat).ladu-=b.qty});o.issued=true;tick(15);logEv(v,'Materjal väljastatud tellimusele');render();toast(L(`Materjal väljastatud: ${v}`,`Material issued: ${v}`))},
  receive(v){const m=mat(v);const add=m.u==='tk'?100:m.u==='m³'?1:m.u==='l'?20:100;m.ladu+=add;tick(5);logEv('—',`Saabus ${fq(add,m.u)} ${m.u} ${m.n} (simuleeritud ost)`);render();toast(L(`Laoseis +${fq(add,m.u)} ${m.u}: ${m.n}`,`Stock +${fq(add,m.u)} ${m.u}: ${m.n}`))},
  recheck(v){const o=S.orders.find(x=>x.nr===v);const short=needFor(o.pk,o.q).filter(n=>n.need>bookedFree(n.k).free+1e-9);
    if(short.length){o.hold=short.map(n=>`${mat(n.k).n}: vaja ${fq(n.need,mat(n.k).u)}, vaba ${fq(bookedFree(n.k).free,mat(n.k).u)}`).join('; ');render();toast(L('Materjal endiselt puudu. Laotöötaja saab registreerida saabumise.','Still short. Warehouse can register receipt.'),true);return}
    needFor(o.pk,o.q).forEach(n=>S.bookings.push({order:o.nr,mat:n.k,qty:n.need,issued:false,used:0,scrap:0}));schedule(o,addWH(S.now,backlogH(o)+2));o.status='planeeritud';o.hold='';tick(3);logEv(o.nr,'Materjal olemas: tellimus planeeritud ja materjal broneeritud');render();toast(L('Tellimus planeeritud, materjal broneeritud','Order planned, material reserved'))},
  failsim(v,el){S.exportFail=el.checked},
  closeOrder(v){const o=S.orders.find(x=>x.nr===v);if(o.status!=='valmis')return;tick(5);o.status='lõpetatud';
    S.bookings.filter(b=>b.order===v).forEach(b=>b.used=b.qty);
    o.exported=S.exportFail?{ok:false,err:'HTTP 503, majandustarkvara ei vastanud 30 s jooksul'}:{ok:true,at:new Date(S.now)};
    logEv(v,'Tellimus lõpetatud'+(S.exportFail?'; edastus majandustarkvarale ebaõnnestus, kirje järjekorras':'; kulu ja praak edastatud majandustarkvarale'));render();toast(S.exportFail?L('Lõpetatud, kuid edastus ebaõnnestus','Closed, but transfer failed'):L('Tellimus lõpetatud ja edastatud','Order closed and sent'),S.exportFail)},
  retryExport(v){const o=S.orders.find(x=>x.nr===v);tick(2);o.exported={ok:true,at:new Date(S.now)};logEv(v,'Korduv edastus majandustarkvarale õnnestus (sama sündmuse_id, duplikaati ei teki)');render();toast(L('Edastus õnnestus','Transfer succeeded'))},
  copyReply(){const t=document.getElementById('reply');try{navigator.clipboard.writeText(t.value).then(()=>toast(L('Kopeeritud','Copied')),()=>{t.select();toast(L('Vajuta Ctrl+C','Press Ctrl+C'))})}catch(e){t.select()}},
  confirmNew(){const d=S.draft;const nr=`PT-2026-0${S.seq++}`;
    const o=buildOrder(nr,d.kt,d.pk,d.q,d.due);schedule(o,addWH(S.now,backlogH(null)+2));S.orders.push(o);
    needFor(d.pk,d.q).forEach(n=>S.bookings.push({order:nr,mat:n.k,qty:n.need,issued:false,used:0,scrap:0}));
    tick(6);logEv(nr,`Tellimus loodud klienditellimusest ${d.kt}, materjal broneeritud (${PRODUCTS[d.pk].bom.length} rida), prognoos ${fd(o.planEnd)}`);
    S.draft=null;S.sel=nr;S.view='detail';render();toast(L(`Tellimus ${nr} kinnitatud`,`Order ${nr} confirmed`))},
  saveHold(){const d=S.draft;const nr=`PT-2026-0${S.seq++}`;const o=buildOrder(nr,d.kt,d.pk,d.q,d.due);o.status='ootel';
    const short=needFor(d.pk,d.q).filter(n=>n.need>bookedFree(n.k).free+1e-9);o.hold=short.map(n=>`${mat(n.k).n}: vaja ${fq(n.need,mat(n.k).u)}, vaba ${fq(bookedFree(n.k).free,mat(n.k).u)}`).join('; ')+'. Ostuvajadus märgitud.';
    S.orders.push(o);tick(4);logEv(nr,'Tellimus salvestatud ootel olekus: '+o.hold);S.draft=null;S.sel=nr;S.view='detail';render();toast(L(`Tellimus ${nr} on ootel`,`Order ${nr} on hold`))}
};
const FORMS={
  search(f){S.lastQ=f.querySelector('#q').value;S.view='search';render()},
  checkNew(f){const fd_=new FormData(f);const kt=String(fd_.get('kt')).trim().toUpperCase(),pk=fd_.get('pk'),qs=String(fd_.get('q')).trim(),due=fd_.get('due');const e={};
    if(!kt)e.kt=L('Sisesta klienditellimuse number.','Enter the customer PO number.');else if(!/^KT-\d{5}$/.test(kt))e.kt=L('Vorming on KT-12345.','Format is KT-12345.');else if(S.orders.some(o=>o.kt===kt))e.kt=L(`Klienditellimuse ${kt} kohta on tootmistellimus juba olemas (${S.orders.find(o=>o.kt===kt).nr}).`,`A production order for ${kt} already exists (${S.orders.find(o=>o.kt===kt).nr}).`);
    if(!pk)e.pk=L('Vali toode.','Choose a product.');
    const q=Number(qs);if(!qs)e.q2=L('Sisesta kogus.','Enter a quantity.');else if(!Number.isInteger(q)||q<1||q>5000)e.q2=L('Kogus peab olema täisarv 1–5000.','Quantity must be a whole number 1–5000.');
    let dd=null;if(!due)e.due=L('Vali tähtaeg.','Choose a due date.');else{dd=new Date(due+'T00:00');const today=new Date(S.now);today.setHours(0,0,0,0);if(dd<today)e.due=L('Tähtaeg ei saa olla minevikus.','Due date cannot be in the past.')}
    S.errors=e;S.draft={kt,pk,q:Object.keys(e).length?qs:q,due:dd,dueStr:due,checked:!Object.keys(e).length};render();
    if(Object.keys(e).length){const first=document.querySelector('.has-err input,.has-err select');first&&first.focus()}},
  saveScrap(f){const o=S.orders.find(x=>x.nr===f.dataset.o),b=o.batches.find(x=>x.id===f.dataset.b),s=b.stages[+f.dataset.i];
    const sc=Number(f.scrap.value),dn=Number(f.down.value);const err=f.querySelector('#scrapErr');
    if(!Number.isInteger(sc)||sc<0||sc>b.qty||!Number.isInteger(dn)||dn<0||dn>600){err.innerHTML=`<span class="err" style="color:var(--bad)">${L(`Praak 0–${b.qty} tk ja seisak 0–600 min, täisarvud.`,`Scrap 0–${b.qty} pcs and downtime 0–600 min, whole numbers.`)}</span>`;return}
    if(!sc&&!dn){err.innerHTML=`<span class="err" style="color:var(--bad)">${L('Sisesta praagi kogus või seisaku kestus.','Enter scrap quantity or downtime.')}</span>`;return}
    tick(3);const msgs=[];
    if(sc){s.scrap+=sc;const p=PRODUCTS[o.pk];const [mk,per]=p.bom[0];const extra=sc*per/(b.koost?1:p.comps.find(c=>c.k===b.comp).per);
      const bk=S.bookings.find(x=>x.order===o.nr&&x.mat===mk);if(bk)bk.scrap=(bk.scrap||0)+extra;
      const free=bookedFree(mk).free;if(extra<=free){S.bookings.push({order:o.nr,mat:mk,qty:extra,issued:false,used:0,scrap:0,extra:true});o.issued=true;msgs.push(L(`Praagi asenduseks broneeriti ${fq(extra,mat(mk).u)} ${mat(mk).u} ${mat(mk).n}.`,`Reserved ${fq(extra,mat(mk).u)} ${mat(mk).u} replacement.`))}
      else msgs.push(L('Asendusmaterjali ei jätku, planeerijat teavitatakse.','Not enough replacement material; planner notified.'));
      logEv(o.nr,`Praak ${sc} tk (${f.scrapWhy.value}) etapis ${opName(s.op)}, ${b.id}`)}
    if(dn){s.downMin+=dn;s.downWhy=f.downWhy.value;logEv(o.nr,`Seisak ${dn} min ${OPS[s.op].st}: ${f.downWhy.value}`)}
    S.modal=null;render();toast(L('Salvestatud. Prognoos uuendatud: ','Saved. Forecast updated: ')+fd(forecast(o))+(msgs.length?' '+msgs.join(' '):''))}
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el||el.tagName==='FORM'||el.tagName==='SELECT'||el.type==='checkbox')return;const a=A[el.dataset.act];if(a){a(el.dataset.v,el,ev)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'){const el=ev.target.closest('tr[data-act]');if(el)A[el.dataset.act](el.dataset.v,el,ev)}if(ev.key==='Escape'&&S.modal){S.modal=null;render()}});
document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset.act&&A[el.dataset.act])A[el.dataset.act](el.value,el,ev)});
document.addEventListener('submit',ev=>{const f=ev.target;ev.preventDefault();if(FORMS[f.dataset.act])FORMS[f.dataset.act](f)});
render();
</script>
</body>
